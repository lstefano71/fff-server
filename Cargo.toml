[package]
name = "fff-server"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "Typed HTTP access to the fff file-search engine"
repository = "https://github.com/lstefano71/fff-server"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dunce = "1.0.5"
fff-query-parser = "0.11"
# `definitions` gates the definition classifier; without it classifyDefinitions
# is accepted but can only ever report false.
fff-search = { version = "0.11", features = ["definitions"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
file-id = "0.2.3"
git2 = { version = "0.21", default-features = false }
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known", "formatting", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "time"] }
utoipa-axum = "0.2.0"

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
