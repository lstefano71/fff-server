[package]
name = "fff-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dunce = "1.0.5"
fff-search = "0.11"
figment = { version = "0.10.19", features = ["toml", "env"] }
file-id = "0.2.3"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde-well-known", "formatting", "macros"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "time"] }
utoipa-axum = "0.2.0"
